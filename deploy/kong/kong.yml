_format_version: "3.0"

consumers:
  - username: rental-system-issuer
    jwt_secrets:
      - key: equipment-rental-system   # must match claim "iss" in the token
        algorithm: HS256
        secret: dev-secret-please-change-min-32-characters  # == JWT_SECRET in .env.example

services:
  - name: user-service
    url: http://user-service:8081
    routes:
      - name: user-public
        paths:
          - /api/v1/auth/register
          - /api/v1/auth/login
          - /api/v1/auth/refresh
          - /health
        strip_path: false
      - name: user-internal
        paths:
          - /api/v1/auth/verify
        strip_path: false
        # No jwt plugin: this endpoint is called service-to-service with
        # X-Internal-Key, not a client JWT.
      - name: user-protected
        paths:
          - /api/v1/auth/logout
          - /api/v1/me
          - /api/v1/users
          - /api/v1/roles
        strip_path: false
        plugins:
          - name: jwt

  - name: product-service
    url: http://product-service:8082
    routes:
      - name: product-public
        paths: ["/health"]
        strip_path: false
      - name: product-protected
        paths:
          - /api/v1/products
          - /api/v1/categories
        strip_path: false
        plugins:
          - name: jwt

  - name: rental-service
    url: http://rental-service:8083
    routes:
      - name: rental-public
        paths: ["/health"]
        strip_path: false
      - name: rental-protected
        paths:
          - /api/v1/rentals
          - /api/v1/me/rentals
        strip_path: false
        plugins:
          - name: jwt
